spring.application.name=chatapp

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/chat_app
spring.datasource.username=chat_user
spring.datasource.password=chat_password123

# Use 'validate' since your table already exists with correct structure
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Optional: See SQL queries in logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.chatapp=DEBUG

# Server port
server.port=8080

# Disable Spring Security for now
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration